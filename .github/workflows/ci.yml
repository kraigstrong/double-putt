name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch or PR replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    # Xcode 27.1's iOS 27.1 SDK is what lets the app run full screen on iPhone Duo, so CI builds with it.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27.1
        run: sudo xcode-select -s /Applications/Xcode_27.1.app && xcodebuild -version
      - name: Build for the iOS Simulator (Debug)
        run: |
          xcodebuild -project MiniGolf.xcodeproj -scheme MiniGolf \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO -quiet build
      # TestFlight archives use Release, where Debug-only code (dev mode, test holes) is compiled out.
      - name: Build for iOS devices (Release)
        run: |
          xcodebuild -project MiniGolf.xcodeproj -scheme MiniGolf -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build/DerivedData \
            CODE_SIGNING_ALLOWED=NO -quiet build

  solver:
    name: Solver
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check every hole's stored double ace
        run: Tools/solve.sh --verify
